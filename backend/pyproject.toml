[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legalintel-api"
version = "0.6.0"
description = "Local FastAPI backend for LegalIntel stages 1–11"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.15.0",
  "python-docx==1.2.0",
  "reportlab==5.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.infrastructure.documents" = ["fonts/*"]
"app.domain.rules" = ["reference_data.json"]
