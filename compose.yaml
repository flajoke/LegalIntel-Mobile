name: legalintel
services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    read_only: true
    volumes:
      - knowledge-data:/app/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  knowledge-data:
